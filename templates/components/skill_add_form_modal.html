<dialog id="add-skill-modal"
     class="skill-form-modal modal"
     popover="auto"
     aria-modal="true"
     aria-labelledby="add-skill-modal-title">
    <div class="scrollable">
        <button type="button"
            id="add-skill-backdrop"
            class="skill-form-modal__backdrop modal__backdrop"
            popovertarget="add-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah skill"></button>

    <section class="skill-form-modal__content modal__content">
        <button type="button"
                id="add-skill-close"
                class="skill-form-modal__close modal__close"
                popovertarget="add-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah skill">×</button>

        <h2 id="add-skill-modal-title">Tambah Skill Baru</h2>
        <form id="skill-form"
              method="post"
              class="skill-form"
              enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="skill-form-modal__actions modal__actions">
                <button type="button"
                        id="add-skill-abort"
                        class="button button-secondary"
                        popovertarget="add-skill-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Skill</button>
            </div>
        </form>
    </section>
    </div>
</dialog>

<script>
    const form = document.getElementById('skill-form');
    const formTitle = document.getElementById('add-skill-modal-title');
    const formSubmitButton = form.querySelector('button[type="submit"]');
    function updateForm(skill) {
        if (skill) {
            for (entry of Object.entries(skill)) {
                const elem = document.getElementById(`id_${entry[0]}`)
                if(elem && entry[0] !== "image") elem.value = entry[1];
            }
            formTitle.innerHTML = `Edit: ${skill.title}`;
            formSubmitButton.innerHTML = 'Edit Skill';
        } else {
            formTitle.innerHTML = 'Tambah Skill Baru';
            formSubmitButton.innerHTML = 'Tambah Skill';
        }
    }

    // Event handler untuk mengunci scroll saat tambah skill
    const addButton = document.getElementById('add-skill-button');
    if (addButton) {
        addButton.addEventListener('click',
            function() {
                document.getElementsByTagName('html').item(0).style.overflow = 'hidden';
            }
        )
    }

    // Event handler untuk membuka kunci scroll tambah skill
    document.getElementById('add-skill-backdrop').addEventListener('click',
        function() {
            document.getElementsByTagName('html').item(0).style.overflow = 'auto';
        }
    )
    
    document.getElementById('add-skill-close').addEventListener('click',
        function() {
            document.getElementsByTagName('html').item(0).style.overflow = 'auto';
        }
    )

    document.getElementById('add-skill-abort').addEventListener('click',
        function() {
            document.getElementsByTagName('html').item(0).style.overflow = 'auto';
        }
    )
</script>
